name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # ubuntu-latest ships Google Chrome, so the browser tests run here too.
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
